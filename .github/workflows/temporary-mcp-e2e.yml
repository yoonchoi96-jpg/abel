name: Temporary MCP E2E

on:
  push:
    paths:
      - ".github/workflows/temporary-mcp-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real MCP tool call
        run: |
          python3 scripts/mcp_smoke_test.py "https://abel-mcp-382528581049.asia-northeast3.run.app/mcp" --call

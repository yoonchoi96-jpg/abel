name: Learning Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: learning-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate snapshot builder
        run: |
          python -m compileall -q scripts
          python scripts/learning_session_test.py
          python scripts/learning_drive_publisher_test.py

      # Personal learning history is not present on an ephemeral GitHub runner.
      # Never generate and commit an empty snapshot as if it were user history.
      - name: External history notice
        run: |
          echo "Abel learning history is external to the GitHub runner."
          echo "Generate snapshots from the durable/local learning DB and publish them through the Drive bridge."

name: Learning Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

concurrency:
  group: learning-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build learning snapshots
        run: |
          python scripts/learning_snapshot.py --all
          python -m json.tool data/learning_snapshots/index.json >/dev/null
          for f in data/learning_snapshots/*.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Commit snapshots
        run: |
          git config user.name "abel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning_snapshots
          if git diff --cached --quiet; then
            echo "No learning snapshot changes."
            exit 0
          fi
          git commit -m "chore: update learning snapshots"
          git push

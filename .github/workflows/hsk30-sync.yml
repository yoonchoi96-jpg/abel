name: HSK 3.0 Vocabulary Sync

on:
  push:
    paths:
      - ".github/workflows/hsk30-sync.yml"
      - "scripts/hsk30_sync.py"
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

concurrency:
  group: hsk30-sync-gh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync HSK 3.0
        run: python scripts/hsk30_sync.py --sync
      - name: Commit HSK database export
        run: |
          git config user.name "abel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hsk30_wordbooks.json
          if git diff --cached --quiet; then
            echo "No HSK export changes."
            exit 0
          fi
          git commit -m "chore: sync HSK 3.0 vocabulary"
          git push

name: Temporary HSK6 E2E
on:
  push:
    paths:
      - '.github/workflows/temporary-hsk6-e2e.yml'
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run HSK6 audio E2E
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          ABEL_APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycby2uN5ArGnOML3fHpEcP5X4wmMv8lsVgg1kuu8ZmRKwkUYvGxtj2tIDyf2FtyAgDdkA/exec
        run: python3 scripts/gemini_audio_executor.py 'HSK6 듣기용 뉴스/보도 형식의 한 편을 만들어라. 실제 HSK6 수준의 어휘와 정보 밀도를 유지하고, 뉴스 전달에 맞는 자연스러운 중국어 구어 정보 구조를 사용하라. 듣기에서 핵심 정보와 인과관계를 추적할 수 있게 구성하고, 불필요한 구어체나 필러는 넣지 마라. 완성된 오디오까지 생성하라.'

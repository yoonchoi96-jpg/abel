name: Deploy Abel MCP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-abel-mcp.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect configured Google Cloud credential secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          found=0
          for name in GCP_SA_KEY GCP_SERVICE_ACCOUNT_KEY GOOGLE_CREDENTIALS GOOGLE_CLOUD_CREDENTIALS GCP_CREDENTIALS_JSON GCP_SERVICE_ACCOUNT_JSON; do
            eval "value=\${$name}"
            if [ -n "$value" ]; then
              echo "FOUND=$name"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "NO_GCP_CREDENTIAL_SECRET_FOUND"
            exit 1
          fi

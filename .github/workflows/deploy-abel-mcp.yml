name: Deploy Abel MCP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-abel-mcp.yml"
      - "Dockerfile"
      - "requirements-mcp.txt"
      - "scripts/abel_mcp_server.py"
      - "scripts/hsk_evaluation_engine.py"
      - "scripts/deploy_abel_mcp.sh"
  workflow_dispatch:

concurrency:
  group: abel-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runner smoke test
        run: |
          echo "GitHub-hosted runner is alive."
          uname -a
          python3 --version
          echo "DEPLOY_PIPELINE_STAGE=runner-ok"

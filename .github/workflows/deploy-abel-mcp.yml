name: Deploy Abel MCP

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements-mcp.txt
      - scripts/abel_mcp_server.py
      - scripts/gemini_tts_renderer.py
      - scripts/tts_router.py
      - scripts/drive_audio_uploader.py
      - scripts/deploy_abel_mcp.sh
      - scripts/mcp_smoke_test.py
      - .github/workflows/deploy-abel-mcp.yml
  workflow_dispatch:

concurrency:
  group: abel-mcp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Abel
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/382528581049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: abel-github-deploy@gen-lang-client-0543639616.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud project
        run: |
          set -euo pipefail
          gcloud config set project "gen-lang-client-0543639616"
          echo "Using project: gen-lang-client-0543639616"

      - name: Deploy Abel MCP to Cloud Run
        env:
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ABEL_DRIVE_FOLDER_ID"
          chmod +x scripts/deploy_abel_mcp.sh
          ./scripts/deploy_abel_mcp.sh

      - name: Smoke test live MCP
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe abel-mcp --region asia-northeast3 --format='value(status.url)')"
          test -n "$URL"
          python3 -m pip install --quiet "mcp>=1.9,<2" "httpx>=0.28,<1"
          python3 scripts/mcp_smoke_test.py "$URL/mcp"

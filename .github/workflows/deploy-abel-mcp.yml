name: Deploy Abel MCP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-abel-mcp.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GCP secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY is not configured."
            exit 1
          fi
          echo "GCP_SA_KEY is configured."

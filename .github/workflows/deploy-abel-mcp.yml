name: Deploy Abel MCP

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements-mcp.txt
      - scripts/abel_mcp_server.py
      - scripts/gemini_tts_renderer.py
      - scripts/drive_audio_uploader.py
      - scripts/deploy_abel_mcp.sh
      - scripts/mcp_smoke_test.py
      - .github/workflows/deploy-abel-mcp.yml
  workflow_dispatch:

concurrency:
  group: abel-mcp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Abel
        uses: actions/checkout@v4

      - name: Check Google Cloud credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GitHub secret GCP_SA_KEY is missing or empty."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud project
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY"
          command -v jq >/dev/null
          PROJECT_ID="$(printf '%s' "$GCP_SA_KEY" | jq -r '.project_id // empty')"
          test -n "$PROJECT_ID"
          gcloud config set project "$PROJECT_ID"
          echo "Using project: $PROJECT_ID"

      - name: Deploy Abel MCP to Cloud Run
        env:
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ABEL_DRIVE_FOLDER_ID"
          chmod +x scripts/deploy_abel_mcp.sh
          ./scripts/deploy_abel_mcp.sh

      - name: Smoke test live MCP
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe abel-mcp             --region asia-northeast3             --format='value(status.url)')"
          test -n "$URL"
          python3 -m pip install --quiet "mcp>=1.9,<2" "httpx>=0.28,<1"
          python3 scripts/mcp_smoke_test.py "$URL/mcp"

name: Learning System Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Abel scripts
        run: python -m compileall -q scripts
      - name: Run learning system tests
        run: |
          PYTHONPATH=. python scripts/learning_session_test.py
          PYTHONPATH=. python scripts/question_bank_index_test.py
          PYTHONPATH=. python scripts/resource_catalog_test.py
          PYTHONPATH=. python scripts/learning_practice_test.py
          PYTHONPATH=. python scripts/mock_test_engine_test.py
          PYTHONPATH=. python scripts/listening_practice_engine_test.py
          PYTHONPATH=. python scripts/reading_practice_engine_test.py
          PYTHONPATH=. python scripts/writing_practice_engine_test.py
          PYTHONPATH=. python scripts/error_review_engine_test.py
          PYTHONPATH=. python scripts/adaptive_learning_plan_test.py
          PYTHONPATH=. python scripts/hsk_mock_builder_test.py
          PYTHONPATH=. python scripts/hsk_scoring_test.py
          PYTHONPATH=. python scripts/education_router_test.py
          PYTHONPATH=. python scripts/education_executor_test.py
          PYTHONPATH=. python scripts/education_provider_adapters_test.py
          PYTHONPATH=. python scripts/education_provider_http_test.py
          PYTHONPATH=. python scripts/education_provider_payloads_test.py
          PYTHONPATH=. python scripts/education_provider_normalizer_test.py
          PYTHONPATH=. python scripts/education_execution_policy_test.py
          PYTHONPATH=. python scripts/education_provider_facade_test.py
          PYTHONPATH=. python scripts/education_provider_registry_test.py
          PYTHONPATH=. python scripts/education_orchestrator_test.py
          PYTHONPATH=. python scripts/education_gateway_test.py
          PYTHONPATH=. python scripts/education_task_adapters_test.py
          PYTHONPATH=. python scripts/education_engine_bridge_test.py
          PYTHONPATH=. python scripts/education_local_dispatch_test.py
          PYTHONPATH=. python scripts/learning_pipeline_test.py

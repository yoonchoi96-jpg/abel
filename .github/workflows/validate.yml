name: Validate Abel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-mcp.txt pytest
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Import production MCP server
        env:
          ABEL_APPS_SCRIPT_URL: https://example.com/abel-apps-script
        run: |
          python - <<'PY'
          import scripts.abel_mcp_server as server
          required = {"generate_lesson_audio", "evaluate_hsk_content", "finalize_hsk_review"}
          missing = {name for name in required if not hasattr(server, name)}
          if missing:
              raise SystemExit(f"Missing MCP tool functions: {sorted(missing)}")
          print("Production MCP server import + tool registration: PASS")
          PY
      - name: Run tests
        run: pytest -q

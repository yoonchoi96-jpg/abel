name: Validate Abel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-mcp.txt pytest
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py
      - name: Import production MCP server
        env:
          ABEL_APPS_SCRIPT_URL: https://example.com/abel-apps-script
        run: |
          python - <<'PY'
          import scripts.abel_mcp_server as server
          required = {"generate_lesson_audio", "evaluate_hsk_content", "finalize_hsk_review", "prepare_chinese_writing_correction", "validate_chinese_writing_correction", "prepare_multilingual_writing_correction", "validate_multilingual_writing_correction", "get_learning_history_summary"}
          missing = {name for name in required if not hasattr(server, name)}
          if missing:
              raise SystemExit(f"Missing MCP tool functions: {sorted(missing)}")
          print("Production MCP server import + tool registration: PASS")
          PY
      - name: Run tests
        run: pytest -q

      - name: Start local production MCP server
        env:
          ABEL_APPS_SCRIPT_URL: https://example.com/abel-apps-script
        run: |
          set -euo pipefail
          python scripts/abel_mcp_server.py > /tmp/abel-mcp.log 2>&1 &
          echo $! > /tmp/abel-mcp.pid
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q '"status":"online"'; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q '"status":"online"'
          python scripts/mcp_smoke_test.py http://127.0.0.1:8080/mcp

      - name: Start authenticated MCP server
        env:
          ABEL_APPS_SCRIPT_URL: https://example.com/abel-apps-script
          MCP_AUTH_TOKEN: ci-test-token
          PORT: "8081"
        run: |
          set -euo pipefail
          python scripts/abel_mcp_server.py > /tmp/abel-mcp-auth.log 2>&1 &
          echo $! > /tmp/abel-mcp-auth.pid
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/ | grep -q '"status":"online"'; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8081/ | grep -q '"status":"online"'
          unauth_code="$(curl -sS -o /tmp/abel-mcp-unauth-response.txt -w '%{http_code}' -X POST http://127.0.0.1:8081/mcp)"
          test "$unauth_code" = "401"
          MCP_AUTH_TOKEN=ci-test-token python scripts/mcp_smoke_test.py http://127.0.0.1:8081/mcp

      - name: Show MCP logs on failure
        if: failure()
        run: |
          cat /tmp/abel-mcp.log || true
          cat /tmp/abel-mcp-auth.log || true
          cat /tmp/abel-mcp-unauth-response.txt || true

      - name: Stop local production MCP servers
        if: always()
        run: |
          if [ -f /tmp/abel-mcp.pid ]; then
            kill "$(cat /tmp/abel-mcp.pid)" || true
          fi
          if [ -f /tmp/abel-mcp-auth.pid ]; then
            kill "$(cat /tmp/abel-mcp-auth.pid)" || true
          fi

name: Experimental Gemini TTS Casual
on:
  push:
    paths:
      - "scripts/gemini_tts_casual.py"
      - "scripts/gemini_tts_renderer.py"
      - "scripts/tts_router.py"
      - "scripts/drive_audio_uploader.py"
      - ".github/workflows/gemini-tts-casual.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/382528581049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: abel-github-deploy@gen-lang-client-0543639616.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install "google-genai>=2.0,<3" "google-auth>=2.0,<3"

      - name: Generate canonical routed Gemini TTS sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: "gemini-3.8-flash-tts"
          GEMINI_TTS_VOICE: "Kore"
        run: python scripts/gemini_tts_casual.py

      - name: Verify MP3
        run: |
          test -s gemini_tts_hsk6_casual.mp3
          file gemini_tts_hsk6_casual.mp3
          ls -lh gemini_tts_hsk6_casual.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: abel-experimental-gemini-tts-hsk6-casual
          path: gemini_tts_hsk6_casual.mp3
          retention-days: 7

name: Experimental Gemini TTS Casual
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate casual Gemini TTS sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_tts_casual.py
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-tts-hsk6-casual
          path: gemini_tts_hsk6_casual.wav
          retention-days: 7

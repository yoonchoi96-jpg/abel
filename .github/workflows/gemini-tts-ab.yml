name: Experimental Gemini TTS A/B

on:
  push:
    paths:
      - "scripts/gemini_tts_ab.py"
      - ".github/workflows/gemini-tts-ab.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate Gemini 3.8 Flash TTS sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_tts_ab.py
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-tts-hsk6-ab-v2
          path: gemini_tts_hsk6_ab_v2.wav
          retention-days: 7

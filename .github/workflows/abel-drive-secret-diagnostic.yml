name: Abel Drive Secret Diagnostic

on:
  push:
    paths:
      - ".github/workflows/abel-drive-secret-diagnostic.yml"
      - "scripts/drive_audio_uploader.py"
  workflow_dispatch:

jobs:
  drive-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Abel
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Drive folder secret shape
        env:
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os, re, hashlib
          v = os.environ.get("ABEL_DRIVE_FOLDER_ID", "")
          print(f"length={len(v)}")
          print(f"sha256={hashlib.sha256(v.encode()).hexdigest()}")
          if not re.fullmatch(r"[A-Za-z0-9_-]{10,}", v):
              raise SystemExit("ABEL_DRIVE_FOLDER_ID is empty or malformed.")
          PY
      - name: Identify Google service account
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get("GCP_SA_KEY", "")
          try:
              data = json.loads(raw)
              email = data.get("client_email", "")
              project = data.get("project_id", "")
              if not email:
                  raise SystemExit("GCP_SA_KEY has no client_email.")
              print(f"service_account={email}")
              print(f"project_id={project}")
          except json.JSONDecodeError:
              raise SystemExit("GCP_SA_KEY is not valid JSON.")
          PY
      - name: Verify Google Drive access
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
        run: python scripts/drive_audio_uploader.py --self-test

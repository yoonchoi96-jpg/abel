name: Naver Wordbook Sync (legacy self-hosted)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy fallback mode
        required: true
        default: probe
        type: choice
        options:
          - probe
          - sync

permissions:
  contents: write

concurrency:
  group: naver-wordbook-sync-legacy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macOS, naver-wordbook]
    timeout-minutes: 20

    steps:
      - name: Legacy self-hosted fallback
        run: |
          echo "::warning::This is a legacy fallback workflow. Prefer 'Naver Wordbook Sync (GitHub-hosted)'."
          echo "The self-hosted Mac runner is intentionally manual-only."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync
        env:
          NAVER_WORDBOOK_EXPORT: data/naver_wordbook.json
          NAVER_BROWSER: chrome
        run: |
          python scripts/naver_wordbook_sync.py --${{ inputs.mode }}

      - name: Commit canonical export
        if: ${{ inputs.mode == 'sync' }}
        run: |
          git config user.name "abel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/naver_wordbook.json
          if git diff --cached --quiet; then
            echo "No wordbook changes."
            exit 0
          fi
          git commit -m "chore: legacy NAVER wordbook sync"
          git push

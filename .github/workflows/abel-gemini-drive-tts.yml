name: Abel Gemini TTS → Google Drive

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Lesson request for Abel"
        required: true
        type: string
      title:
        description: "Optional lesson title"
        required: false
        type: string
      level:
        description: "Lesson level"
        required: false
        default: "HSK6"
        type: string
      topic:
        description: "Optional topic"
        required: false
        type: string

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Abel
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (existing Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/382528581049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: abel-github-deploy@gen-lang-client-0543639616.iam.gserviceaccount.com
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install Abel dependencies
        run: pip install -r requirements.txt
      - name: Verify Google Drive access
        env:
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID || '1un78ru9F32LCWMY9EDbt8hDPcrP2KHzU' }}
        run: python scripts/drive_audio_uploader.py --self-test
      - name: Generate lesson, Gemini TTS, and publish to Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID || '1un78ru9F32LCWMY9EDbt8hDPcrP2KHzU' }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_TTS_MODEL: "gemini-3.8-flash-tts"
          GEMINI_TTS_VOICE: "Kore"
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_LEVEL: ${{ inputs.level }}
          INPUT_TOPIC: ${{ inputs.topic }}
        run: |
          python scripts/gemini_audio_executor.py \
            "$INPUT_PROMPT" \
            --title "$INPUT_TITLE" \
            --level "$INPUT_LEVEL" \
            --topic "$INPUT_TOPIC"

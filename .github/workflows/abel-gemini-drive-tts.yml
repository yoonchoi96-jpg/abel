name: Abel Gemini TTS → Routed Learning Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/abel-gemini-drive-tts.yml"
  workflow_dispatch:
    inputs:
      prompt:
        description: "Lesson request for Abel"
        required: true
        type: string
      title:
        description: "Optional lesson title"
        required: false
        type: string
      language:
        description: "Learning language code/name (e.g. zh-CN, es, fr)"
        required: false
        default: "zh-CN"
        type: string
      skill:
        description: "Learning skill"
        required: false
        default: "listening"
        type: string
      level:
        description: "Lesson level"
        required: false
        default: "HSK6"
        type: string
      topic:
        description: "Optional topic"
        required: false
        type: string

jobs:
  generate-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Run Abel TTS integration test') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Abel
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install Abel dependencies
        run: pip install -r requirements.txt
      - name: Validate Drive folder secret shape
        env:
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os, re, hashlib
          v = os.environ.get("ABEL_DRIVE_FOLDER_ID", "")
          print(f"ABEL_DRIVE_FOLDER_ID length={len(v)}")
          print(f"ABEL_DRIVE_FOLDER_ID sha256={hashlib.sha256(v.encode()).hexdigest()}")
          if not re.fullmatch(r"[A-Za-z0-9_-]{10,}", v):
              raise SystemExit("ABEL_DRIVE_FOLDER_ID is empty or not a valid-looking Google Drive folder ID.")
          PY
      - name: Verify Google Drive access
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_ID }}
          GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN }}
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
        run: python scripts/drive_audio_uploader.py --self-test
      - name: Generate lesson, Gemini TTS, and publish to Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_ID }}
          GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_SECRET }}
          GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN }}
          ABEL_DRIVE_FOLDER_ID: ${{ secrets.ABEL_DRIVE_FOLDER_ID }}
          GEMINI_MODEL: "gemini-3.8-flash"
          GEMINI_TTS_MODEL: "gemini-3.8-flash-tts"
          GEMINI_TTS_VOICE: "Kore"
          LESSON_PROMPT: ${{ inputs.prompt }}
          LESSON_LANGUAGE: ${{ inputs.language }}
          LESSON_SKILL: ${{ inputs.skill }}
          LESSON_LEVEL: ${{ inputs.level }}
          LESSON_TITLE: ${{ inputs.title }}
          LESSON_TOPIC: ${{ inputs.topic }}
        run: |
          PROMPT="${LESSON_PROMPT:-Create a short HSK6 Chinese listening practice lesson for a Drive integration test.}"
          LANGUAGE="${LESSON_LANGUAGE:-zh-CN}"
          SKILL="${LESSON_SKILL:-listening}"
          LEVEL="${LESSON_LEVEL:-HSK6}"
          TITLE="${LESSON_TITLE:-Abel OAuth Drive Integration Test}"
          TOPIC="${LESSON_TOPIC:-OAuth Drive upload test}"
          python scripts/gemini_audio_executor.py \
            "$PROMPT" \
            "Use these canonical learning metadata values: language=$LANGUAGE, skill=$SKILL, level=$LEVEL, title=$TITLE, topic=$TOPIC. When calling generate_lesson_audio, pass these exact values in the language, skill, level, title, and topic fields."
